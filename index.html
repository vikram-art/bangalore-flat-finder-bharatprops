<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bangalore Flat Finder by BharatProps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="maplibre-gl.css">
<style>
/* Layout idea: full-bleed night map; filter rail on the left, project card slides in on the right. Single dark theme by choice. */
:root{
  color-scheme:dark;
  --night:#0a0f1e;      /* map ground */
  --panel:#111830;      /* rails and cards */
  --raise:#1a2342;      /* controls */
  --line:#2a3560;       /* borders */
  --ink:#eef1fb;        /* main text */
  --mute:#9aa6cc;       /* secondary text */
  --sun:#ffb72b;        /* accent: a match */
  --sun-ink:#231700;
  --likely:#6fd3ff;     /* likely match */
  --sold:#6b7391;
  --good:#58d68d;
  --f-display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--ink);font:14px/1.45 var(--f-body);overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
#app{position:relative;height:100%;display:flex}
#map{position:absolute;inset:0}
.rail{position:relative;z-index:3;width:372px;max-width:100%;height:100%;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line)}
.brand{padding:14px 18px 10px;border-bottom:1px solid var(--line)}
.brand small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.brand h1{font:700 23px/1.1 var(--f-display);margin:4px 0 0;text-wrap:balance}
.brand h1 em{font-style:normal;color:var(--sun)}
.scroll{flex:1;overflow-y:auto;padding:12px 18px 20px;display:flex;flex-direction:column;gap:14px}
.search{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--raise)}
.search::placeholder{color:var(--mute)}
.grp{display:flex;flex-direction:column;gap:7px}
.lab{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);display:flex;justify-content:space-between;gap:8px}
.lab b{font-weight:600;color:var(--ink);letter-spacing:0;text-transform:none;font-size:12.5px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--raise);font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:var(--sun-ink);font-weight:600}
.chip:hover{border-color:var(--mute)}
input[type=range]{width:100%;accent-color:var(--sun);margin:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
select{width:100%;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--raise)}
.tog{display:flex;align-items:center;gap:8px;font-size:13px}
.tog input{accent-color:var(--sun);width:16px;height:16px}
.reset{align-self:flex-start;background:none;border:0;color:var(--likely);padding:0;text-decoration:underline;font-size:13px}
.resbar{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.count{font:700 26px/1 var(--f-display);font-variant-numeric:tabular-nums}
.count span{font:400 12.5px var(--f-body);color:var(--mute);margin-left:6px}
.resbar select{width:auto;font-size:12.5px;padding:6px 8px}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--raise);width:100%}
.item:hover,.item.on{border-color:var(--sun)}
.item .n{font-weight:600;overflow-wrap:anywhere}
.item .p{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.item .s{grid-column:1/-1;font-size:12.5px;color:var(--mute)}
.pill{font-style:normal;display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600;vertical-align:1px;margin-right:6px}
.pill.fit{background:var(--sun);color:var(--sun-ink)}
.pill.likely{background:transparent;color:var(--likely);border:1px solid var(--likely)}
.pill.sold{background:transparent;color:var(--sold);border:1px solid var(--sold)}
.pill.new{background:#23365f;color:#bcd4ff}
.pill.uc{background:#3a2f55;color:#dccbff}
.pill.ready{background:#17402e;color:#a5efc6}
.more{align-self:center;background:none;border:1px solid var(--line);border-radius:999px;padding:7px 16px}
.foot{font-size:11.5px;color:var(--mute)}
.foot a{color:var(--mute)}
/* map controls */
.mapbar{position:absolute;z-index:2;top:12px;left:384px;right:12px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
.mapbar>*{pointer-events:auto}
.mbtn{padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:rgba(17,24,48,.92);font-size:13px}
.mbtn[aria-pressed="true"]{border-color:var(--sun);color:var(--sun)}
.legend{margin-left:auto;display:flex;gap:12px;align-items:center;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:rgba(17,24,48,.92);font-size:12px;color:var(--mute);flex-wrap:wrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.attr{position:absolute;z-index:2;right:8px;bottom:6px;font-size:10.5px;color:var(--mute);background:rgba(10,15,30,.7);padding:2px 6px;border-radius:6px}
.attr a{color:inherit}
/* markers */
.plabel{font:600 11px var(--f-body);color:#c9d3f5;letter-spacing:.08em;text-transform:uppercase;text-shadow:0 0 4px var(--night),0 0 4px var(--night);pointer-events:none;white-space:nowrap}
.hlabel{font:500 10.5px var(--f-body);color:var(--mute);text-shadow:0 0 4px var(--night),0 0 4px var(--night);pointer-events:none;white-space:nowrap}
.hlabel::before{content:"";display:inline-block;width:6px;height:6px;transform:rotate(45deg);background:var(--likely);margin-right:5px}
.price{pointer-events:auto;font:600 11px var(--f-body);background:var(--sun);color:var(--sun-ink);padding:2px 7px;border-radius:999px;white-space:nowrap;cursor:pointer;transform:translateY(-16px);box-shadow:0 2px 8px rgba(0,0,0,.5)}
.price.likely{background:var(--panel);color:var(--likely);border:1px solid var(--likely)}
.z-lo .hlabel,.z-lo .price{display:none}
.maplibregl-popup-content{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font:13px var(--f-body)}
.maplibregl-popup-tip{display:none}
/* project card */
.card{position:absolute;z-index:4;top:0;right:0;bottom:0;width:430px;max-width:100%;background:var(--panel);border-left:1px solid var(--line);display:none;flex-direction:column}
.card.open{display:flex}
.chead{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:6px 10px}
.chead h2{font:700 22px/1.15 var(--f-display);margin:0;text-wrap:balance;overflow-wrap:anywhere}
.chead .sub{grid-column:1/-1;color:var(--mute);font-size:13px}
.x{border:1px solid var(--line);background:var(--raise);border-radius:999px;width:34px;height:34px;font-size:18px;line-height:1}
.cbody{flex:1;overflow-y:auto;padding:14px 18px 18px;display:flex;flex-direction:column;gap:16px}
.cbody>*{flex:none}
.big{font:700 26px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.big small{font:400 12.5px var(--f-body);color:var(--mute);display:block;margin-top:3px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin:0}
.facts div{min-width:0}
.facts dt{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.facts dd{margin:1px 0 0;font-weight:500;overflow-wrap:anywhere}
h3{font:600 12px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:0 0 7px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{font-weight:500;color:var(--mute);text-align:left;padding:4px 8px 6px 0;border-bottom:1px solid var(--line);font-size:11.5px}
td{padding:6px 8px 6px 0;border-bottom:1px solid rgba(42,53,96,.5)}
td.r,th.r{text-align:right;padding-right:0}
tr.hit td{color:var(--sun)}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{padding:3px 9px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:#cfd7f3}
.near{display:grid;gap:5px;margin:0;padding:0;list-style:none;font-size:13px}
.near li{display:flex;justify-content:space-between;gap:10px}
.near span:last-child{color:var(--mute);text-align:right;font-variant-numeric:tabular-nums}
.view3d{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.view3d a,.view3d button{display:block;text-align:center;padding:9px 8px;border-radius:10px;border:1px solid var(--line);background:var(--raise);text-decoration:none;color:var(--ink);font-size:13px}
.view3d a:hover,.view3d button:hover{border-color:var(--sun)}
.view3d .wide{grid-column:1/-1;border-color:var(--likely);color:var(--likely);font-weight:600}
.bplink{display:block;text-align:center;padding:11px;border-radius:12px;border:1px solid var(--sun);color:var(--sun);font-weight:600;text-decoration:none}.bplink:hover{background:rgba(255,183,43,.1)}
.hero{flex:none;position:relative;margin:-14px -18px 0;height:190px;background:linear-gradient(#0d1533,#1b2550 70%,#16382b 70%,#122a22);overflow:hidden}
.hero img,.hero svg{width:100%;height:100%;display:block;object-fit:cover}
.hero figcaption{position:absolute;left:10px;bottom:8px;font-size:11px;color:#dfe5fb;background:rgba(10,15,30,.72);padding:2px 8px;border-radius:999px}
figure{margin:0}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.tile{background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:9px 6px;text-align:center;min-width:0}
.tile b{display:block;font:700 19px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.tile span{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.meter{position:relative;height:10px;border-radius:999px;background:linear-gradient(90deg,#1f6b4a,#8a7a1f,#8a3b2a);margin:16px 0 6px}
.meter i{position:absolute;top:-5px;width:4px;height:20px;border-radius:2px;background:#fff;transform:translateX(-2px)}
.meter u{position:absolute;top:-3px;width:2px;height:16px;background:rgba(255,255,255,.45);text-decoration:none}
.scale{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.bars{display:grid;gap:8px;margin:0;padding:0;list-style:none;font-size:13px}
.bars .top{display:flex;justify-content:space-between;gap:10px}
.bars .top span:last-child{font-variant-numeric:tabular-nums;color:var(--mute)}
.bar{height:6px;border-radius:999px;background:var(--raise);margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--likely)}
.bar i.ok{background:var(--good)}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:5px 14px;margin:0;padding:0;list-style:none;font-size:13px}
.checks li{display:flex;gap:8px;align-items:center}
.checks li.no{color:var(--sold)}
.checks i{font-style:normal;width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;background:#17402e;color:#a5efc6;flex:none}
.checks li.no i{background:var(--raise);color:var(--sold)}
details summary{cursor:pointer;color:var(--mute);font-size:12.5px;margin-top:8px}
.stats{font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.sat{width:100%;height:230px;border:1px solid var(--line);border-radius:12px;background:var(--night)}
.cfoot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px}
.cta{flex:1;text-align:center;padding:12px;border-radius:12px;background:var(--sun);color:var(--sun-ink);font-weight:600;text-decoration:none;border:0}
.save{padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--raise)}
.save[aria-pressed="true"]{border-color:var(--sun);color:var(--sun)}
.hint{font-size:12px;color:var(--mute)}
.listbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px}
.listbar a{color:var(--likely)}
@media (max-width:860px){
  body{overflow:auto}
  #app{flex-direction:column;height:auto;min-height:100%}
  #map{position:relative;inset:auto;height:46vh;min-height:300px;order:1}
  .rail{order:2;width:100%;height:auto;border-right:0;border-top:1px solid var(--line)}
  .scroll{overflow:visible}
  .mapbar{left:12px;top:10px}
  .legend{display:none}
  .card{position:fixed;width:100%}
  .attr{bottom:auto;top:calc(46vh - 24px);position:absolute}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="map" class="z-lo" aria-label="Map of East Bangalore projects"></div>

  <aside class="rail" aria-label="Filters and results">
    <div class="brand">
      <small>Bangalore Flat Finder · by BharatProps · East Bangalore</small>
      <h1>Find the flat that <em>fits</em>.</h1>
    </div>
    <div class="scroll">
      <input id="q" class="search" type="search" placeholder="Search project, builder or area" autocomplete="off">

      <div class="grp"><div class="lab">Type</div><div class="chips" id="f-kind"></div></div>
      <div class="grp"><div class="lab">BHK</div><div class="chips" id="f-bhk"></div></div>

      <div class="grp">
        <div class="lab"><label for="pmax">Budget up to</label><b id="pmax-v">Any</b></div>
        <input id="pmax" type="range" min="0" max="20" step="1" value="20">
      </div>
      <div class="grp">
        <div class="lab"><label for="sq">Home size at least</label><b id="sq-v">Any</b></div>
        <input id="sq" type="range" min="0" max="4000" step="100" value="0">
      </div>

      <div class="grp"><div class="lab">Corridor</div><div class="chips" id="f-cor"></div></div>
      <div class="grp"><div class="lab">Stage</div><div class="chips" id="f-st"></div>
        <label class="tog"><input id="sold" type="checkbox"> Also show sold-out projects</label>
      </div>

      <div class="grp"><div class="lab">Amenities</div><div class="chips" id="f-am"></div></div>

      <div class="grp">
        <div class="lab"><label for="metro">Metro station within</label><b id="metro-v">Any</b></div>
        <input id="metro" type="range" min="0" max="5" step="1" value="0">
      </div>
      <div class="grp">
        <div class="lab">Close to work</div>
        <div class="row2">
          <select id="off" aria-label="Tech park"><option value="">Any tech park</option></select>
          <select id="offkm" aria-label="Distance to tech park"><option value="3">within 3 km</option><option value="5" selected>within 5 km</option><option value="8">within 8 km</option><option value="12">within 12 km</option></select>
        </div>
      </div>
      <div class="grp">
        <div class="lab">Builder and possession</div>
        <div class="row2">
          <select id="dev" aria-label="Builder"><option value="">Any builder</option></select>
          <select id="poss" aria-label="Possession by"><option value="">Any possession</option><option value="2026">By 2026</option><option value="2027">By 2027</option><option value="2028">By 2028</option><option value="2029">By 2029</option><option value="2030">By 2030</option></select>
        </div>
      </div>
      <button class="reset" id="reset" type="button">Clear all filters</button>

      <div class="resbar">
        <div class="count" id="count">0<span>projects</span></div>
        <select id="sort" aria-label="Sort results">
          <option value="best">Best match</option>
          <option value="plow">Price, low to high</option>
          <option value="phigh">Price, high to low</option>
          <option value="poss">Possession, soonest</option>
          <option value="metro">Nearest metro</option>
          <option value="land">Largest land parcel</option>
        </select>
      </div>
      <div class="stats" id="sum"></div>
      <div class="listbar" id="listbar"></div>
      <div class="list" id="list"></div>
      <button class="more" id="more" type="button" hidden>Show more</button>
      <p class="foot" id="foot"></p>
    </div>
  </aside>

  <div class="mapbar">
    <button class="mbtn" id="b3d" type="button" aria-pressed="true">3D view</button>
    <button class="mbtn" id="bsat" type="button" aria-pressed="false" hidden>Satellite</button>
    <button class="mbtn" id="bfit" type="button">Fit results</button>
    <div class="legend">
      <span><i class="dot" style="background:var(--sun);border-radius:2px"></i>Fits</span>
      <span><i class="dot" style="background:var(--likely);border-radius:2px"></i>Likely</span>
      <span><i class="dot" style="background:#3a4672;border-radius:2px"></i>Doesn't match</span>
      <span><i class="dot" style="background:#ff5d8f"></i>Metro</span>
    </div>
  </div>
  <div class="attr">Map data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors</div>

  <section class="card" id="card" aria-live="polite"></section>
</div>

<script src="maplibre-gl.js"></script>

/* ---------- matching: 2 = fits, 1 = likely, 0 = no ---------- */
function unitFit(u){
  // u = [name, beds, sqft, priceLakh]; returns 2 fits, 1 unknown, 0 fails
  let r = 2;
  if (S.bhk.size){ if (u[1] == null) return 0; if (!S.bhk.has(bucket(u[1]))) return 0; }
  if (S.pmax != null){ if (u[3] == null) r = 1; else if (u[3] > S.pmax) return 0; }
  if (S.sq){ if (u[2] == null) r = 1; else if (u[2] < S.sq) return 0; }
  return r;
}
function match(p){
  if (p.sold && !S.sold) return 0;
  if (S.kind.size && !S.kind.has(p.kind)) return 0;
  if (S.cor.size && !S.cor.has(p.cor)) return 0;
  if (S.st.size && !S.st.has(p.st)) return 0;
  for (const a of S.am) if (!p.am.includes(a)) return 0;
  if (S.metro && p.metro[0] > S.metro) return 0;
  if (S.off){ const o = p.off.find(x => x[1] === S.off); if (!o || o[0] > S.offkm) return 0; }
  if (S.dev && p.brand !== S.dev) return 0;
  if (S.poss){ if (p.st !== "ready" && (!p.py || p.py > +S.poss)) return 0; }
  if (S.q){ const h = (p.name + " " + p.dev + " " + p.loc + " " + p.cor).toLowerCase(); for (const w of S.q.toLowerCase().split(/\s+/)) if (w && !h.includes(w)) return 0; }
  if (!S.bhk.size && S.pmax == null && !S.sq) return 2;
  let best = 0;
  for (const u of p.u){ const f = unitFit(u); if (f > best) best = f; if (best === 2) break; }
  if (best === 1 && S.pmax != null && p.pmin > S.pmax) best = 0; // unit price not listed and even the cheapest home is over budget
  if (best) return best;
  // fall back to the project's stated range when unit rows are missing
  if (!p.u.length || p.u.every(u => u[3] == null && u[2] == null)){
    if (S.bhk.size && !p.bhk.some(b => S.bhk.has(bucket(b)))) return 0;
    if (S.pmax != null && p.pmin > S.pmax) return 0;
    return 1;
  }
  return 0;
}
function fromPrice(p){
  // lowest price among units that satisfy BHK and size, else project minimum
  let m = null;
  if (S.bhk.size || S.sq) for (const u of p.u){ if (u[3] != null && unitFit(u)) m = m == null ? u[3] : Math.min(m, u[3]); }
  return m ?? p.pmin;
}

/* ---------- filter UI ---------- */
function chipGroup(el, items, set, labelOf){
  el.innerHTML = items.map(v => `<button type="button" class="chip" data-v="${esc(v)}" aria-pressed="false">${esc(labelOf(v))}</button>`).join("");
  el.addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    let v = b.dataset.v; if (el.id === "f-bhk") v = +v;
    set().has(v) ? set().delete(v) : set().add(v);
    b.setAttribute("aria-pressed", set().has(v)); apply();
  });
}
function syncUI(){
  $("q").value = S.q; $("sold").checked = S.sold;
  $("pmax").value = S.pmax == null ? 20 : BUDGET.indexOf(S.pmax); $("pmax-v").textContent = S.pmax == null ? "Any" : money(S.pmax);

  for (const id in sets) for (const b of $(id).children){ let v = b.dataset.v; if (id === "f-bhk") v = +v; b.setAttribute("aria-pressed", sets[id].has(v)); }
}

  $("q").addEventListener("input", e => { S.q = e.target.value.trim(); apply(); });

/* ---------- results ---------- */
let RES = [];
function apply(){
  RES = [];
  for (const p of P){ p.m = match(p); if (p.m) RES.push(p); }
  const by = {
    best: (a,b) => (b.m - a.m) || ((BP[b.id]?1:0) - (BP[a.id]?1:0)) || ((a.sold?1:0) - (b.sold?1:0)) || (b.id - a.id),
    plow: (a,b) => fromPrice(a) - fromPrice(b),
    phigh: (a,b) => b.pmax - a.pmax,
    poss: (a,b) => (a.st === "ready" ? 0 : a.py || 9999) - (b.st === "ready" ? 0 : b.py || 9999),
    metro: (a,b) => a.metro[0] - b.metro[0],
    land: (a,b) => (b.acres || 0) - (a.acres || 0)
  }[S.sort];
  RES.sort(by); shown = 40; renderList(); paint();
}
function renderList(){
  const fits = RES.filter(p => p.m === 2).length, likely = RES.length - fits;
  $("count").innerHTML = `${RES.length}<span>${RES.length === 1 ? "project" : "projects"}${likely ? ` · ${fits} fit, ${likely} likely` : ""}</span>`;
  $("list").innerHTML = RES.slice(0, shown).map(p => `
    <button type="button" class="item${p.id === openId ? " on" : ""}" data-id="${p.id}">
      <span class="n">${esc(p.name)}</span><span class="p">${money(fromPrice(p))}+</span>
      <span class="s">${p.sold ? '<i class="pill sold">Sold out</i>' : p.m === 1 ? '<i class="pill likely">Likely</i>' : `<i class="pill ${p.st}">${STAGE[p.st]}</i>`}${esc(p.loc)} · ${p.bhk.length ? esc(p.bhk.join(", ")) + " BHK" : KIND[p.kind]}${p.metro[0] <= 2 ? " · metro " + p.metro[0] + " km" : ""}</span>
    </button>`).join("") || `<p class="hint">Nothing fits these filters. Raise the budget, drop an amenity, or clear all filters.</p>`;
  $("more").hidden = RES.length <= shown;
  const ps = RES.filter(p => p.psf).map(p => p.psf);
  $("sum").textContent = RES.length ? `From ${money(Math.min(...RES.map(fromPrice)))} to ${money(Math.max(...RES.map(p => p.pmax)))}${ps.length >= 3 ? " · typical ₹" + median(ps).toLocaleString("en-IN") + " per sq ft" : ""}` : "";
  const sv = P.filter(p => saved.has(p.id));
  $("listbar").innerHTML = sv.length ? `<span>My shortlist: ${sv.length}</span><a href="${waLink("My shortlist from the " + CONFIG.brand + " Flat Finder:\n" + sv.map(p => "• " + p.name + ", " + p.loc + " (" + money(p.pmin) + " onwards)").join("\n") + "\nPlease share price sheets and site visit slots.")}" target="_blank" rel="noopener">Send to ${esc(CONFIG.brand)} on WhatsApp</a>` : "";
}
function waLink(text){ return "https://wa.me/" + CONFIG.whatsapp + "?text=" + encodeURIComponent(text); }
function need(){
  const b = [];
  if (S.bhk.size) b.push([...S.bhk].sort().map(x => x === 5 ? "5+" : x).join("/") + " BHK");
  if (S.pmax != null) b.push("budget up to " + money(S.pmax));
  if (S.sq) b.push("at least " + S.sq + " sq ft");
  return b.length ? " My requirement: " + b.join(", ") + "." : "";
}

/* ---------- map ---------- */
const fc = feats => ({type:"FeatureCollection", features:feats});
const lines = arr => fc(arr.map(c => ({type:"Feature", geometry:{type:"LineString", coordinates:c}, properties:{}})));
/* Every project is drawn as a 3D model: site pad, podium, towers with floor bands, and a crown.
   Models are illustrations built from each project's land size, tower count and floor count. They are scaled up as you zoom out so they stay visible. */
function shape(p){
  if (p.kind === "plot") return {n:Math.min(Math.max(p.units||24,8),36), fl:0, w:16};
  if (p.kind === "villa") return {n:Math.min(Math.max(p.units||24,6),40), fl:Math.min(p.floors||2,3), w:11};
  const fl = p.floors || 12;
  return {n:p.towers || Math.min(Math.max(Math.round((p.units||150)/(fl*6)),1),8), fl, w:27};
}
const FOOT = [
  [[-1,-.62],[1,-.62],[1,.62],[-1,.62]],
  [[-.62,-1],[.62,-1],[1,-.62],[1,.62],[.62,1],[-.62,1],[-1,.62],[-1,-.62]],
  [[-.42,-1],[.42,-1],[.42,-.42],[1,-.42],[1,.42],[.42,.42],[.42,1],[-.42,1],[-.42,.42],[-1,.42],[-1,-.42],[-.42,-.42]],
  [[-1,-.7],[1,-.7],[1,.7],[.42,.7],[.42,-.1],[-.42,-.1],[-.42,.7],[-1,.7]]
];
const SKIN = { // glass, floor line, podium, crown
  2:["#f2a91f","#fff1cc","#6b4a12","#ffd77a"], 1:["#3fa9d9","#dff5ff","#1d4f66","#9be0ff"],
  0:["#2a3559","#3e4b7a","#1c2440","#465488"], 3:["#7a8199","#b3b8cc","#454a5e","#c3c7d6"]
};
function scaleK(){ const mpp = 78271.5 * Math.cos(12.95*Math.PI/180) / Math.pow(2, map ? map.getZoom() : 11); return Math.max(1, 9*mpp/27); }
let lastK = 0, PADS = fc([]);
function projFC(){
  const k = scaleK(); lastK = Math.round(k*4)/4;
  const feats = [], pads = [], detail = k <= 1.6;
  const view = map && detail ? map.getBounds() : null;
  const inView = p => !view || (p.lng > view.getWest()-.02 && p.lng < view.getEast()+.02 && p.lat > view.getSouth()-.02 && p.lat < view.getNorth()+.02);
  for (const p of P){
    if (!inView(p)) continue;
    const sh = shape(p), m = p.m||0, kk = m ? k : Math.max(1, k*.6), sel = p.id === openId ? 1 : 0;
    const skin = SKIN[m && p.sold ? 3 : m], a = (p.id % 50 - 25) * Math.PI/180, ca = Math.cos(a), sa = Math.sin(a), cl = Math.cos(p.lat*Math.PI/180);
    const ll = (x,y) => [p.lng + (x*ca - y*sa)/(111320*cl), p.lat + (x*sa + y*ca)/111320];
    const poly = (pts, base, top, c) => { const r = pts.map(q => ll(q[0],q[1])); r.push(r[0]); feats.push({type:"Feature", geometry:{type:"Polygon", coordinates:[r]}, properties:{id:p.id, b:base, h:top, c}}); };
    const foot = (f, cx, cy, hw, hd) => f.map(q => [cx + q[0]*hw, cy + q[1]*hd]);
    const tower = (cx, cy, w, fl, f, bands) => {
      const fh = 3.1*kk, total = fl*fh, hw = w/2;
      if (bands > 2) poly(foot(FOOT[0], cx, cy, hw*1.22, hw*1.0), 0, 2*fh, sel ? "#ffffff" : skin[2]);     // podium
      const base = bands > 2 ? 2*fh : 0, step = (total - base)/bands;
      for (let i = 0; i < bands; i++){
        const b0 = base + i*step;
        poly(foot(f, cx, cy, hw, hw), b0, b0 + step*.84, skin[0]);                                          // glass floors
        poly(foot(f, cx, cy, hw*1.05, hw*1.05), b0 + step*.84, b0 + step, sel ? "#ffffff" : skin[1]);        // floor line
      }
      poly(foot(FOOT[0], cx, cy, hw*.5, hw*.34), total, total + 2.2*fh, sel ? "#ffffff" : skin[3]);          // crown
    };
    if (p.kind === "apt"){
      const n = kk > 3 ? 1 : kk > 1.6 ? Math.min(sh.n,4) : Math.min(sh.n,18);
      const w = sh.w*kk, cols = Math.ceil(Math.sqrt(n)), rows = Math.ceil(n/cols);
      const side = detail ? Math.min(Math.max(Math.sqrt((p.acres||4)*4047), cols*w*1.7, 70), 520) : 0;
      const gap = detail ? Math.max(w*1.7, Math.min(w*4, side/(cols+.4))) : w*1.9;
      if (detail){
        const hs = Math.max(side, gap*cols + w*.6)/2, hd = Math.max(side*.8, gap*rows + w*.6)/2, r = [[-hs,-hd],[hs,-hd],[hs,hd],[-hs,hd]].map(q => ll(q[0],q[1])); r.push(r[0]);
        pads.push({type:"Feature", geometry:{type:"Polygon", coordinates:[r]}, properties:{id:p.id, m, sel}});
        poly(foot(FOOT[0], hs - 24, -hd + 16, 17, 10), 0, 7, sel ? "#ffffff" : skin[3]);                      // clubhouse
      }
      const bands = detail ? Math.max(3, Math.ceil(sh.fl/2)) : kk > 3 ? 3 : 5, f = FOOT[p.id % 4];
      for (let i = 0; i < n; i++){
        const cx = ((i % cols) - (cols-1)/2) * gap, cy = (Math.floor(i/cols) - (rows-1)/2) * gap;
        tower(cx, cy, w, Math.max(sh.fl + (detail ? ((i*7 + p.id) % 3) - 1 : 0), 3), f, bands);
      }
    } else if (!detail){
      const w = 30*kk; poly(foot(FOOT[0], 0, 0, w/2, w/2*.62), 0, (p.kind === "plot" ? 1.2 : 5)*kk, skin[0]);
      if (p.kind === "villa") poly(foot(FOOT[0], 0, 0, w/2*.7, w/2*.4), 5*kk, 7.5*kk, skin[3]);
    } else {
      const n = sh.n, cols = Math.ceil(Math.sqrt(n*1.4)), rows = Math.ceil(n/cols), gx = sh.w*1.9, gy = sh.w*1.7;
      const hs = cols*gx/2 + 8, hd = rows*gy/2 + 8, r = [[-hs,-hd],[hs,-hd],[hs,hd],[-hs,hd]].map(q => ll(q[0],q[1])); r.push(r[0]);
      pads.push({type:"Feature", geometry:{type:"Polygon", coordinates:[r]}, properties:{id:p.id, m, sel}});
      for (let i = 0; i < n; i++){
        const cx = ((i % cols) - (cols-1)/2) * gx, cy = (Math.floor(i/cols) - (rows-1)/2) * gy;
        if (p.kind === "plot") poly(foot(FOOT[0], cx, cy, sh.w/2, sh.w/2*.72), 0, .7, skin[0]);
        else { poly(foot(FOOT[0], cx, cy, sh.w/2, sh.w/2*.8), 0, sh.fl*3.1, skin[0]); poly(foot(FOOT[0], cx, cy, sh.w/2*1.08, sh.w/2*.5), sh.fl*3.1, sh.fl*3.1 + 2.2, sel ? "#ffffff" : skin[1]); }
      }
    }
  }
  PADS = fc(pads);
  return fc(feats);
}
function selFC(){ const p = P.find(x => x.id === openId); return fc(p ? [{type:"Feature", geometry:{type:"Point", coordinates:[p.lng,p.lat]}, properties:{}}] : []); }
function paint(){
  if (!map || !map.getSource("proj")) return;
  map.getSource("proj").setData(projFC()); map.getSource("pad").setData(PADS); map.getSource("sel").setData(selFC()); priceLabels();
}
function priceLabels(){
  labelMarkers.forEach(m => m.remove()); labelMarkers = [];
  if (!map || map.getZoom() < 12.2) return;
  const b = map.getBounds(), vis = RES.filter(p => b.contains([p.lng,p.lat]));
  if (vis.length > 45) return;
  for (const p of vis){
    const el = document.createElement("div"); el.className = "price" + (p.m === 1 ? " likely" : ""); el.textContent = money(fromPrice(p)) + "+";
    el.addEventListener("click", ev => { ev.stopPropagation(); openCard(p.id, false); });
    labelMarkers.push(new maplibregl.Marker({element:el, anchor:"bottom"}).setLngLat([p.lng,p.lat]).addTo(map));
  }
}
function fitResults(){
  if (!RES.length) return;
  const b = new maplibregl.LngLatBounds(); RES.forEach(p => b.extend([p.lng,p.lat]));
  map.fitBounds(b, {padding:{top:80,bottom:60,left:innerWidth > 860 ? 420 : 40,right:60}, maxZoom:14.5, duration:700, pitch:map.getPitch(), bearing:map.getBearing()});
}
function addOverlays(){
  const B = BASE;
  if (!online){
    map.addSource("water", {type:"geojson", data:fc(B.water.map(r => ({type:"Feature", geometry:{type:"Polygon", coordinates:r}, properties:{}})))});
    map.addLayer({id:"water", type:"fill", source:"water", paint:{"fill-color":"#14294d"}});
    for (const [k,col,w] of [["c","#1c2748",[10,.4,14,1.6]],["b","#2a3a6b",[10,.8,14,3]],["a","#3b4f8c",[10,1.4,14,4.5]]]){
      map.addSource("r"+k, {type:"geojson", data:lines(B.roads[k])});
      map.addLayer({id:"r"+k, type:"line", source:"r"+k, layout:{"line-cap":"round","line-join":"round"}, paint:{"line-color":col, "line-width":["interpolate",["linear"],["zoom"],...w]}});
    }
    map.addSource("rail", {type:"geojson", data:lines(B.rail)});
    map.addLayer({id:"rail", type:"line", source:"rail", paint:{"line-color":"#55608a","line-width":1,"line-dasharray":[3,3]}});
  } else {
    map.addSource("sat", {type:"raster", tiles:["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"], tileSize:256, maxzoom:18, attribution:"Imagery © Esri"});
    const first = map.getStyle().layers.find(l => l.type === "line" || l.type === "symbol");
    map.addLayer({id:"sat", type:"raster", source:"sat", layout:{visibility:"none"}}, first && first.id);
    const src = Object.keys(map.getStyle().sources).find(s => map.getStyle().sources[s].type === "vector");
    if (src && !map.getLayer("b3d")) map.addLayer({id:"b3d", type:"fill-extrusion", source:src, "source-layer":"building", minzoom:13.5, paint:{"fill-extrusion-color":"#1a2240","fill-extrusion-height":["coalesce",["get","render_height"],8],"fill-extrusion-base":["coalesce",["get","render_min_height"],0],"fill-extrusion-opacity":.7}});
    $("bsat").hidden = false;
  }
  map.addSource("metro", {type:"geojson", data:lines(B.metro)});
  map.addLayer({id:"metro", type:"line", source:"metro", paint:{"line-color":"#ff5d8f","line-width":["interpolate",["linear"],["zoom"],10,1.2,14,3],"line-opacity":.85}});
  map.addSource("stn", {type:"geojson", data:fc(B.stations.map(s => ({type:"Feature", geometry:{type:"Point", coordinates:[s[0],s[1]]}, properties:{n:s[2]+" metro"}})))});
  map.addLayer({id:"stn", type:"circle", source:"stn", minzoom:11, paint:{"circle-radius":["interpolate",["linear"],["zoom"],11,2,15,5],"circle-color":"#0a0f1e","circle-stroke-color":"#ff5d8f","circle-stroke-width":1.5}});
  map.addSource("sel", {type:"geojson", data:selFC()});
  map.addLayer({id:"sel", type:"circle", source:"sel", paint:{"circle-radius":["interpolate",["linear"],["zoom"],10,14,13,26,16,90],"circle-color":"#ffffff","circle-opacity":.1,"circle-stroke-color":"#ffffff","circle-stroke-width":1.5,"circle-pitch-alignment":"map"}});
  map.addSource("proj", {type:"geojson", data:projFC()});
  map.addSource("pad", {type:"geojson", data:PADS});
  map.addLayer({id:"pad", type:"fill", source:"pad", paint:{"fill-color":["case",[">",["get","m"],0],"#1f4a36","#182540"],"fill-opacity":.85,"fill-outline-color":["case",["==",["get","sel"],1],"#ffffff",[">",["get","m"],0],"#58d68d","#33406b"]}});
  map.addLayer({id:"p2", type:"fill-extrusion", source:"proj", paint:{"fill-extrusion-color":["get","c"],"fill-extrusion-base":["get","b"],"fill-extrusion-height":["get","h"],"fill-extrusion-opacity":.96,"fill-extrusion-vertical-gradient":true}});
  map.setLight({anchor:"viewport", color:"#ffffff", intensity:.42, position:[1.4,215,38]});
  // area names from where the projects cluster
  const loc = {}; P.forEach(p => { (loc[p.loc] = loc[p.loc] || []).push(p); });
  Object.entries(loc).filter(e => e[1].length >= 5).forEach(([n,a]) => {
    const el = document.createElement("div"); el.className = "plabel"; el.textContent = n;
    new maplibregl.Marker({element:el}).setLngLat([a.reduce((s,p) => s+p.lng,0)/a.length, a.reduce((s,p) => s+p.lat,0)/a.length + .006]).addTo(map);
  });
  B.hubs.filter(h => h[3] === "w").forEach(h => { const el = document.createElement("div"); el.className = "hlabel"; el.textContent = h[2]; new maplibregl.Marker({element:el, anchor:"left"}).setLngLat([h[0],h[1]]).addTo(map); });
  const pop = new maplibregl.Popup({closeButton:false, closeOnClick:false, offset:12});
  for (const id of ["pad","p2"]){
    map.on("mousemove", id, e => { const p = P.find(x => x.id === e.features[0].properties.id); map.getCanvas().style.cursor = "pointer"; pop.setLngLat([p.lng,p.lat]).setHTML(`<b>${esc(p.name)}</b><br>${esc(p.loc)} · ${money(p.pmin)} onwards${p.sold ? " · sold out" : ""}`).addTo(map); });
    map.on("mouseleave", id, () => { map.getCanvas().style.cursor = ""; pop.remove(); });
    map.on("click", id, e => openCard(e.features[0].properties.id, false));
  }
  map.on("mousemove", "stn", e => { pop.setLngLat(e.lngLat).setHTML(esc(e.features[0].properties.n)).addTo(map); });
  map.on("mouseleave", "stn", () => pop.remove());
  const z = () => $("map").classList.toggle("z-lo", map.getZoom() < 11.6);
  map.on("zoom", () => { z(); if (Math.round(scaleK()*4)/4 !== lastK) paint(); }); z(); map.on("moveend", () => { if (scaleK() <= 1.6) paint(); else priceLabels(); });
}
async function initMap(){
  let style = {version:8, sources:{}, layers:[{id:"bg", type:"background", paint:{"background-color":"#0a0f1e"}}]};
  try { // on your own domain the live street map, satellite and 3D buildings switch on; inside previews this is blocked and the built-in map is used
    const c = new AbortController(); setTimeout(() => c.abort(), 2500);
    const r = await fetch("https://tiles.openfreemap.org/styles/dark", {signal:c.signal});
    if (r.ok){ style = await r.json(); online = true; }
  } catch(e) {}
  const [S_,W,N,E] = BASE.bbox;
  map = new maplibregl.Map({container:"map", style, center:[77.725,12.945], zoom:11.2, pitch:52, bearing:-14, minZoom:9.5, maxZoom:18, maxBounds:[[W-.25,S_-.2],[E+.25,N+.2]], attributionControl:false, maxPitch:70});
  map.addControl(new maplibregl.NavigationControl({visualizePitch:true}), "bottom-right");
  map.on("load", () => { addOverlays(); paint(); fitResults(); if (location.hash.startsWith("#p-")) openCard(+location.hash.slice(3), true); });
}

/* ---------- project card ---------- */
const median = a => { const b = [...a].sort((x,y) => x-y); return b.length ? b[Math.floor(b.length/2)] : null; };
function prep(){
  for (const p of P){ const v = p.u.filter(u => u[2] && u[3]).map(u => u[3]*1e5/u[2]); p.psf = v.length ? Math.round(median(v)) : null; }
}
function corridorPsf(p){
  const v = P.filter(x => x.cor === p.cor && x.kind === p.kind && x.psf && !x.sold).map(x => x.psf).sort((a,b) => a-b);
  return v.length >= 5 ? {lo:v[Math.floor(v.length*.05)], mid:median(v), hi:v[Math.floor(v.length*.95)], n:v.length} : null;
}
function heroSVG(p){
  const W = 430, H = 190, G = 150, sh = shape(p); let g = "";
  if (p.kind === "apt"){
    const n = Math.min(sh.n, 9), tw = Math.min(40, (W-50)/n - 8), x0 = (W - n*(tw+8) + 8)/2, top = Math.max(sh.fl, 14);
    for (let i = 0; i < n; i++){
      const fl = Math.max(sh.fl + ((i*7 + p.id) % 3) - 1, 3), h = fl/top*(G-44), x = x0 + i*(tw+8), y = G - h;
      g += `<rect x="${x-3}" y="${G-9}" width="${tw+6}" height="9" fill="#6b4a12"/><rect x="${x}" y="${y}" width="${tw}" height="${h-9}" fill="url(#win)"/><rect x="${x}" y="${y}" width="${tw}" height="${h-9}" fill="none" stroke="#fff1cc" stroke-width=".6"/><rect x="${x+tw*.3}" y="${y-6}" width="${tw*.4}" height="6" fill="#ffd77a"/>`;
    }
  } else if (p.kind === "villa"){
    for (let i = 0; i < 7; i++){ const x = 28 + i*56; g += `<rect x="${x}" y="${G-34}" width="40" height="34" fill="url(#win)"/><path d="M${x-5} ${G-34} L${x+20} ${G-54} L${x+45} ${G-34}Z" fill="#ffd77a"/>`; }
  } else {
    for (let r = 0; r < 3; r++) for (let c = 0; c < 8; c++) g += `<path d="M${40+c*46-r*14} ${G-70+r*26} h38 l-12 20 h-38z" fill="none" stroke="#ffd77a" stroke-width="1.2"/>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Illustration of ${esc(p.name)}"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1230"/><stop offset="1" stop-color="#27356b"/></linearGradient><pattern id="win" width="8" height="7" patternUnits="userSpaceOnUse"><rect width="8" height="7" fill="#b9801a"/><rect x="1.5" y="1.5" width="5" height="3.4" fill="#ffd77a"/></pattern></defs><rect width="${W}" height="${H}" fill="url(#sky)"/><circle cx="${W-56}" cy="38" r="15" fill="#fff1cc" opacity=".85"/><rect y="${G}" width="${W}" height="${H-G}" fill="#16382b"/>${g}</svg>`;
}
function openCard(id, fly){
  const p = P.find(x => x.id === id); if (!p) return;
  openId = id; try { history.replaceState(null, "", "#p-" + id); } catch(e) { location.hash = "p-" + id; }
  const g = `${p.lat},${p.lng}`, q = encodeURIComponent(p.name + " " + p.loc + " Bangalore");
  const earth = `https://earth.google.com/web/@${p.lat},${p.lng},880a,650d,35y,20h,62t,0r`;
  const units = p.u.filter(u => u[2] || u[3]);
  const rows = units.slice(0, 14).map(u => `<tr class="${(S.bhk.size || S.pmax != null || S.sq) && unitFit(u) === 2 ? "hit" : ""}"><td>${esc(u[0])}</td><td class="r">${u[2] ? u[2].toLocaleString("en-IN") : "–"}</td><td class="r">${u[3] ? money(u[3]) : "On request"}</td><td class="r">${u[2] && u[3] ? "₹" + Math.round(u[3]*1e5/u[2]).toLocaleString("en-IN") : "–"}</td></tr>`).join("");
  const sh = shape(p), cp = p.psf ? corridorPsf(p) : null, img = BP[p.id] && BP_IMG[BP[p.id]];
  const facts = [
    ["Stage", p.sold ? "Sold out by builder" : STAGE[p.st]], ["Possession", p.poss || "–"],
    ["Homes", p.bhk.length ? p.bhk.join(", ") + " BHK" : KIND[p.kind]], ["RERA", p.rera ? p.rera : (p.rera_st === "ok" ? "Registered" : p.rera_st === "pending" ? "Awaited" : "–")]
  ];
  const tiles = [[p.acres ? p.acres + " ac" : "–", "Land"], [p.kind === "apt" ? (p.towers || "–") : KIND[p.kind].slice(0,-1), p.kind === "apt" ? "Towers" : "Type"], [p.floors ? "G+" + p.floors : "–", "Floors"], [p.units ? p.units.toLocaleString("en-IN") : "–", "Units"]];
  const dist = [["Metro: " + esc(p.metro[1]), p.metro[0], 2], ...p.off.slice(0,3).map(o => [esc(o[1]), o[0], 5])];
  const checks = ["pool","gym","clubhouse","kids","jogging","courts","indoor","spa","yoga","pet","cowork","theatre"];
  const pos = cp ? Math.min(Math.max((p.psf - cp.lo)/Math.max(cp.hi - cp.lo, 1), 0), 1)*100 : 0, mpos = cp ? Math.min(Math.max((cp.mid - cp.lo)/Math.max(cp.hi - cp.lo, 1), 0), 1)*100 : 0;
  $("card").innerHTML = `
    <div class="chead"><h2>${esc(p.name)}</h2><button class="x" id="cx" type="button" aria-label="Close">×</button>
      <div class="sub">${esc(p.dev)} · ${esc(p.loc)}, ${esc(p.cor)}</div></div>
    <div class="cbody">
      <figure class="hero" id="hero">${img ? `<img src="${img}" alt="${esc(p.name)}" referrerpolicy="no-referrer"><figcaption>Photo: BharatProps</figcaption>` : heroSVG(p) + `<figcaption>Illustration from tower and floor counts</figcaption>`}</figure>
      <div class="big">${money(p.pmin)}${p.pmax > p.pmin ? " to " + money(p.pmax) : ""}<small>Indicative price, ${esc(CONFIG.dataDate)}${p.psf ? " · about ₹" + p.psf.toLocaleString("en-IN") + " per sq ft" : ""}</small></div>
      <div class="tiles">${tiles.map(t => `<div class="tile"><b>${esc(t[0])}</b><span>${t[1]}</span></div>`).join("")}</div>
      <dl class="facts">${facts.map(f => `<div><dt>${f[0]}</dt><dd>${esc(f[1])}</dd></div>`).join("")}</dl>
      <a class="bplink" href="${BP[p.id] ? BP_SITE + "/project/" + BP[p.id] : BP_SITE + "/projects"}" target="_blank" rel="noopener">${BP[p.id] ? "See photos and full details on BharatProps" : "Browse projects with photos on BharatProps"} →</a>
      ${cp ? `<div><h3>Price against ${esc(p.cor)}</h3>
        <div class="meter"><u style="left:${mpos}%"></u><i style="left:${pos}%"></i></div>
        <div class="scale"><span>₹${cp.lo.toLocaleString("en-IN")}</span><span>typical ₹${cp.mid.toLocaleString("en-IN")}</span><span>₹${cp.hi.toLocaleString("en-IN")}</span></div>
        <p class="hint" style="margin:6px 0 0">This project is ${p.psf > cp.mid*1.05 ? Math.round((p.psf/cp.mid-1)*100) + "% above" : p.psf < cp.mid*.95 ? Math.round((1-p.psf/cp.mid)*100) + "% below" : "in line with"} the typical price per sq ft of ${cp.n} available ${({apt:"apartment",villa:"villa",plot:"plot"})[p.kind]} projects in this corridor.</p></div>` : ""}
      <div><h3>See the location in 3D</h3>
        <div class="view3d">
          <a class="wide" href="${earth}" target="_blank" rel="noopener">Open 3D view in Google Earth</a>
          <button type="button" id="fly3d">See the 3D model on the map</button>
          <a href="https://www.google.com/maps/@?api=1&map_action=map&center=${g}&zoom=18&basemap=satellite" target="_blank" rel="noopener">Satellite on Google Maps</a>
          <a href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${g}" target="_blank" rel="noopener">Street View</a>
          <a href="https://www.google.com/maps/dir/?api=1&destination=${g}" target="_blank" rel="noopener">Directions</a>
        </div>
        ${online ? `<iframe class="sat" style="margin-top:8px" loading="lazy" title="Satellite view of ${esc(p.name)}" src="https://maps.google.com/maps?q=${g}&t=k&z=17&output=embed"></iframe>` : ""}
        <p class="hint" style="margin:7px 0 0">The 3D model on the map is an illustration built from this project's land, tower and floor counts. <a style="color:inherit" href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">Photos and reviews on Google Maps</a></p>
      </div>
      ${rows ? `<div><h3>Unit sizes and prices</h3><div class="tw"><table><thead><tr><th>Type</th><th class="r">Sq ft</th><th class="r">Price</th><th class="r">Per sq ft</th></tr></thead><tbody>${rows}</tbody></table></div>${units.length > 14 ? `<p class="hint">${units.length - 14} more unit types on request.</p>` : ""}</div>` : ""}
      <div><h3>Getting around</h3><ul class="bars">${dist.map(d => `<li><div class="top"><span>${d[0]}</span><span>${d[1]} km</span></div><div class="bar"><i class="${d[1] <= d[2] ? "ok" : ""}" style="width:${Math.max(Math.min(d[1]/15,1)*100,3)}%"></i></div></li>`).join("")}</ul>
        <p class="stats" style="margin:9px 0 0">${p.near.school[0]} schools within 1 km · ${p.near.hospital[0]} hospitals within 2 km · ${p.near.shop[0]} supermarkets or malls within 1.5 km</p></div>
      ${p.am.length ? `<div><h3>Amenities</h3><ul class="checks">${checks.map(c => `<li class="${p.am.includes(c) ? "" : "no"}"><i>${p.am.includes(c) ? "✓" : "–"}</i>${AMEN[c]}</li>`).join("")}</ul>
        <details><summary>Full list from the builder (${p.amraw.length})</summary><div class="tags" style="margin-top:8px">${p.amraw.map(a => `<span class="tag">${esc(a)}</span>`).join("")}</div></details></div>` : ""}
    </div>
    <div class="cfoot">
      <a class="cta" href="${waLink(`Hi ${CONFIG.brand}, I am interested in ${p.name}, ${p.loc}. Please share the price sheet and available units.${need()}`)}" target="_blank" rel="noopener">Get price sheet on WhatsApp</a>
      <button class="save" id="sv" type="button" aria-pressed="${saved.has(id)}">${saved.has(id) ? "Saved" : "Save"}</button>
    </div>`;
  $("card").classList.add("open");
  const hi = $("hero").querySelector("img"); if (hi) hi.onerror = () => { $("hero").innerHTML = heroSVG(p) + "<figcaption>Illustration from tower and floor counts</figcaption>"; };
  $("cx").onclick = closeCard;
  $("sv").onclick = () => { saved.has(id) ? saved.delete(id) : saved.add(id); persist(); $("sv").setAttribute("aria-pressed", saved.has(id)); $("sv").textContent = saved.has(id) ? "Saved" : "Save"; renderList(); };
  $("fly3d").onclick = () => { $("b3d").setAttribute("aria-pressed", true); map.flyTo({center:[p.lng,p.lat], zoom:15.6, pitch:66, bearing:25, duration:1600, padding:{right:innerWidth > 860 ? 430 : 0, left:innerWidth > 860 ? 372 : 0}}); if (innerWidth <= 860) closeCard(); };
  if (fly && map) map.flyTo({center:[p.lng,p.lat], zoom:Math.max(map.getZoom(), 14), duration:900, padding:{right:innerWidth > 860 ? 430 : 0, left:innerWidth > 860 ? 372 : 0}});
  renderList(); paint();
}
function closeCard(){ openId = null; $("card").classList.remove("open"); try { history.replaceState(null, "", location.pathname + location.search); } catch(e) {} renderList(); paint(); }
document.addEventListener("keydown", e => { if (e.key === "Escape" && openId) closeCard(); });

/* ---------- start ---------- */
(async function(){
  try {
    [P, BASE] = await Promise.all([fetch("projects.json").then(r => r.json()), fetch("basemap.json").then(r => r.json())]);
  } catch(e) { $("list").innerHTML = `<p class="hint">The project data did not load. Refresh the page to try again.</p>`; return; }
  prep(); buildUI(); syncUI(); apply(); initMap();
})();
</script>
